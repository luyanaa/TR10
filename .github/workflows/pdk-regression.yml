name: PDK regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdk-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned tools image: LibreLane + OpenROAD + KLayout + Magic + ngspice.
  # The GPL patch in flow/patches/librelane was generated from this exact
  # image; bump the digest and regenerate the patch together.
  EDA_IMAGE: hpretl/iic-osic-tools@sha256:306585de35d198e70ea58950f77147c86f56c698726a19afea9f1c83009557be

jobs:
  pdk-checks:
    name: PDK release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out TR10 PDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: TR10

      - name: Run flow/checks/run_all.sh
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/pdk_root" \
            -w /pdk_root/TR10 \
            -e PDK_ROOT=/pdk_root -e PDK=TR10 \
            -e USER_ID="$(id -u)" -e GROUP_ID="$(id -g)" \
            "$EDA_IMAGE" --skip bash -lc 'bash flow/checks/run_all.sh'

  librelane-klayout-lvs:
    name: inv (LibreLane RTL-to-GDS + KLayout LVS)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out TR10 PDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: TR10

      - name: RTL-to-GDS, then KLayout LVS assertion
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/pdk_root" \
            -v "$GITHUB_WORKSPACE/TR10/flow/patches/librelane/gpl.tcl:/usr/local/lib/python3.12/dist-packages/librelane/scripts/openroad/gpl.tcl:ro" \
            -w /pdk_root/TR10 \
            -e PDK_ROOT=/pdk_root -e PDK=TR10 \
            -e USER_ID="$(id -u)" -e GROUP_ID="$(id -g)" \
            "$EDA_IMAGE" --skip bash -lc \
              'bash flow/checks/run_librelane_lvs.sh inv inv ci'

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: librelane-lvs-inv
          if-no-files-found: warn
          retention-days: 14
          path: |
            TR10/examples/inv/ll.log
            TR10/examples/inv/runs/ci/**/*.log
            TR10/examples/inv/runs/ci/**/*.rpt
